window.startImport = async function() {
  if (!uid) return;
  const btn = document.getElementById('importBtn');
  const log = document.getElementById('log');
  const bar = document.getElementById('progressBar');
  const msg = document.getElementById('statusMsg');
  btn.disabled = true;
  btn.textContent = 'جارٍ الاستيراد...';
  log.textContent = '';
  let done = 0;
  const cRef = ref(db, 'users/' + uid + '/cases');
  for (const c of cases) {
    try {
      await push(cRef, c);
      done++;
      bar.style.width = Math.round(done/cases.length*100) + '%';
      msg.textContent = 'تم ' + done + ' من ' + cases.length;
      log.textContent += '✓ ' + c.doc + ' — ' + (c.pat||'—') + ' (' + c.teeth + ' سن)\n';
      log.scrollTop = log.scrollHeight;
    } catch(e) {
      log.textContent += '✗ خطأ: ' + (c.pat||c.doc) + '\n';
    }
  }
  msg.textContent = '✅ اكتمل! ' + done + ' حالة';
  btn.textContent = '✅ تم';
  bar.style.background = '#10b981';
};
