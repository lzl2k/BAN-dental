// حساب الإحصائيات
const cbCases = cases.filter(c=>c.type==='CB');
const faCases = cases.filter(c=>c.type==='FA');
const cbTeeth = cbCases.reduce((s,c)=>s+c.teeth,0);
const faTeeth = faCases.reduce((s,c)=>s+c.teeth,0);
const docs = new Set(cases.map(c=>c.doc)).size;

document.getElementById('statsDiv').innerHTML = `
  <span class="stat">📋 ${cases.length} حالة</span>
  <span class="stat">CB: ${cbTeeth} سن (${cbCases.length} حالة)</span>
  <span class="fa stat">FA: ${faTeeth} سن (${faCases.length} حالة)</span>
  <span class="total stat">🦷 ${cbTeeth+faTeeth} سن إجمالي</span>
  <span class="stat">👨‍⚕️ ${docs} طبيب/عيادة</span>
  <span class="stat">📅 شهر 5 / 2026</span>
`;

let uid=null;
onAuthStateChanged(auth,u=>{
  if(u){
    uid=u.uid;
    document.getElementById('statusMsg').textContent='مرحباً '+u.displayName+' — جاهز للاستيراد';
    document.getElementById('importBtn').disabled=false;
  } else {
    document.getElementById('statusMsg').textContent='يجب تسجيل الدخول أولاً';
    document.getElementById('importBtn').textContent='🔑 تسجيل الدخول بـ Google';
    document.getElementById('importBtn').onclick=async()=>{
      await signInWithPopup(auth,new GoogleAuthProvider());
    };
  }
});

window.startImport=async function(){
  if(!uid)return;
  const btn=document.getElementById('importBtn');
  const log=document.getElementById('log');
  const bar=document.getElementById('progressBar');
  const msg=document.getElementById('statusMsg');
  btn.disabled=true;
  btn.textContent='⏳ جارٍ الاستيراد...';
  log.textContent='';
  let done=0;
  const cRef=ref(db,'users/'+uid+'/cases');
  for(const c of cases){
    try{
      await push(cRef,c);
      done++;
      bar.style.width=Math.round(done/cases.length*100)+'%';
      msg.textContent='تم '+done+' من '+cases.length;
      log.textContent+=(c.type==='FA'?'★ ':'✓ ')+c.doc+' — '+(c.pat||'—')+' ('+c.teeth+' سن '+c.type+')\n';
      log.scrollTop=log.scrollHeight;
    } catch(e){
      log.textContent+='✗ خطأ في: '+c.doc+'\n';
    }
  }
  msg.textContent='✅ اكتمل الاستيراد! '+done+' حالة تم رفعها';
  btn.textContent='✅ تم الاستيراد';
  bar.style.background='#10b981';
};
</script>
